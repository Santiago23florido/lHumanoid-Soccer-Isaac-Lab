[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humanoid-soccer-lab"
version = "0.1.0"
description = "Isaac Lab external extension for humanoid robot soccer."
# No readme key: setuptools refuses to read a file outside the package
# directory, and this pyproject lives one level below the repository root.
# Pointing it at ../../README.md made every editable install fail.
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Santiago" }]
keywords = ["isaac-lab", "humanoid", "soccer", "reinforcement-learning", "robotics"]
dependencies = ["gymnasium>=0.29"]

[tool.setuptools.packages.find]
where = ["."]
include = ["humanoid_soccer_lab*"]
