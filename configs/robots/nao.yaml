# Descriptive summary of the Phase 1 robot. Planning document only:
# the authoritative configuration is NAO_CFG in
# source/humanoid_soccer_lab/humanoid_soccer_lab/assets/nao.py

name: NaoH25V50
description: SoftBank Robotics / Aldebaran NAO H25, version 5.0

source:
  urdf: assets/robots/nao/urdf/nao.urdf      # tracked, BSD 3-Clause, verbatim
  meshes: assets/robots/nao/meshes/V40       # untracked, CC BY-NC-ND 4.0, fetched
  attribution: third_party/nao/README.md

asset:
  cfg: humanoid_soccer_lab.assets.nao.NAO_CFG
  usd_path: assets/generated/nao/usd/nao.usd  # untracked build artifact
  prim_path: /World/Robots/Nao
  fix_base: false
  spawn_height_m: 0.36        # sole offset 0.33301 + ~2.7 cm clearance

# Read back from the imported articulation, not hand-written targets.
structure:
  bodies: 43
  joints: 42
  independent_actuated_joints: 25
  mimic_joints: 17            # RHipYawPitch + 16 finger/thumb joints
  fixed_frames_merged: 36     # cameras, sonars, FSRs, bumpers, IMU, tactile
  total_mass_kg: 5.3054

actuators:
  strategy: implicit_pd
  stiffness: null             # inherited from USD; no controller in Phase 1
  damping: null
  joint_groups:
    legs: []
    torso: []
    arms: []
    head: []

sensors:
  imu: false
  feet_contact: false

notes:
  - Phase 1 is asset integration only; no RL, rewards, observations or actions.
  - With no controller the robot collapses under gravity. That is expected and
    is what validates the articulation.
  - LElbowRoll and RElbowRoll cannot reach zero; their defaults are clamped
    into the URDF's own limits.
