[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humanoid-soccer-lab"
version = "0.1.0"
description = "Isaac Lab external extension scaffold for humanoid robot soccer."
readme = "../../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Santiago" }]
keywords = ["isaac-lab", "humanoid", "soccer", "reinforcement-learning", "robotics"]
dependencies = ["gymnasium>=0.29"]

[tool.setuptools.packages.find]
where = ["."]
include = ["humanoid_soccer_lab*"]
